resolver 127.0.0.11 valid=10s ipv6=off;
upstream autoagenda_backend {
 zone autoagenda_backend 64k;
 server autoagenda-api:8000 resolve;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index autoagenda.html;
 client_max_body_size 16k;
 add_header Referrer-Policy "no-referrer" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
 location = /api/v1/autoagenda/public/ {
  proxy_pass http://autoagenda_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 65s;
  add_header Cache-Control "no-store" always;
 }
 location /api/ { return 404; }
 location /admin/ { return 404; }
 location /assets/ { try_files $uri =404; expires 1d; }
 location / { try_files $uri $uri/ /autoagenda.html; }
}

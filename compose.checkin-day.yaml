services:
  api:
    image: orbita-api:checkin-day
    environment:
      CHECKIN_SCHEDULER_ENABLED: "1"
      CHECKIN_ORACLE_SCHEDULER_ENABLED: "1"
  autoagenda-api:
    image: orbita-api:checkin-day
  worker:
    image: orbita-api:checkin-day
    environment:
      CHECKIN_SCHEDULER_ENABLED: "1"
      CHECKIN_ORACLE_SCHEDULER_ENABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
  scheduler:
    image: orbita-api:checkin-day
    command: ["celery", "-A", "config", "beat", "--loglevel=warning", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      CHECKIN_SCHEDULER_ENABLED: "1"
      CHECKIN_ORACLE_SCHEDULER_ENABLED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert b'beat' in Path('/proc/1/cmdline').read_bytes(); assert time.time()-Path('/tmp/celerybeat-schedule').stat().st_mtime<600"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
  panel:
    image: orbita-panel:checkin-day
